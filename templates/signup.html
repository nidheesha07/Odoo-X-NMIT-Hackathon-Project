{% extends "base.html" %}
{% block title %}Sign Up - Dayflow{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Create your account</h1>
    <form method="POST" action="{{ url_for('signup') }}">
        <label for="employee_id">Employee ID</label>
        <input type="text" id="employee_id" name="employee_id" value="{{ form.employee_id or '' }}" required>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" value="{{ form.name or '' }}" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ form.email or '' }}" required>

        <label for="password">Password (min 6 characters)</label>
        <input type="password" id="password" name="password" minlength="6" required>

        <label for="role">Role</label>
        <select id="role" name="role">
            <option value="employee" {% if form.role == 'employee' %}selected{% endif %}>Employee</option>
            <option value="admin" {% if form.role == 'admin' %}selected{% endif %}>Admin / HR</option>
        </select>

        <button type="submit" class="btn-primary">Sign Up</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
